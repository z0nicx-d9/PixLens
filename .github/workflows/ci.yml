name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

  plugin:
    name: Claude Code mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The mod API is early access: pin the version it was last checked against.
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate .
      - run: claude plugin test plugin

  overlay:
    name: Pixlens Overlay (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: plugin/overlay/build.sh

  coverage:
    name: Coverage (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Every function is tested; LLVM's line count lists a couple of lines
      # twice (the library is built for unit and end-to-end tests), so the
      # line bar sits just under 100.
      - run: cargo llvm-cov --summary-only --fail-under-functions 100 --fail-under-lines 99.5

