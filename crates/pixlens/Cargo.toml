[package]
name = "pixlens"
version = "0.1.0"
description = "Image preview for the terminal and for Claude Code: decode, fit and draw images as kitty graphics, iTerm2 inline images or truecolor half-blocks"
keywords = ["image", "terminal", "kitty", "claude", "preview"]
categories = ["command-line-utilities", "multimedia::images"]
readme = "../../README.md"
homepage = "https://github.com/z0nicx-d9/PixLens"
documentation = "https://docs.rs/pixlens"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["svg"]
svg = ["dep:resvg"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
resvg = { version = "0.48.1", optional = true, default-features = false, features = ["text", "system-fonts", "raster-images"] }
serde_json = "1.0.152"
terminal_size = "0.4.4"

[lints]
workspace = true
