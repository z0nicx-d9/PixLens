<svg xmlns="http://www.w3.org/2000/svg" width="116" height="20" viewBox="0 0 116 20" role="img" aria-label="DEVORBIT">
  <title>DEVORBIT</title>
  <defs>
    <!-- deep space, purple to blue, with two nebula glows -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a33"/>
      <stop offset=".55" stop-color="#2a1660"/>
      <stop offset="1" stop-color="#0d1b4a"/>
    </linearGradient>
    <radialGradient id="nebula-pink" cx="25%" cy="85%" r="45%">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-blue" cx="80%" cy="15%" r="45%">
      <stop offset="0" stop-color="#3fb6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-opacity=".18"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="round">
      <rect width="116" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="116" height="20" fill="url(#space)"/>
    <rect width="116" height="20" fill="url(#nebula-pink)"/>
    <rect width="116" height="20" fill="url(#nebula-blue)"/>
    <!-- stars -->
    <g fill="#fff" shape-rendering="crispEdges">
      <rect x="39" y="3" width="1" height="1" opacity=".9"/>
      <rect x="53" y="16" width="1" height="1" opacity=".6"/>
      <rect x="70" y="2" width="1" height="1" opacity=".7"/>
      <rect x="85" y="17" width="1" height="1" opacity=".8"/>
      <rect x="100" y="4" width="1" height="1" opacity=".9"/>
      <rect x="111" y="15" width="1" height="1" opacity=".6"/>
      <rect x="27" y="2" width="1" height="1" opacity=".8"/>
      <rect x="2" y="3" width="1" height="1" opacity=".7"/>
      <rect x="107" y="9" width="1" height="1" opacity=".5"/>
    </g>
    <rect x="33" y="4" width="1" height="12" fill="#fff" opacity=".18"/>
    <rect width="116" height="20" fill="url(#shine)"/>
  </g>
  <!-- a pixel kaiju riding a two-stage booster up at 30 degrees: the
       upright drawing tipped 60 degrees to the right about its middle -->
  <g shape-rendering="crispEdges" transform="translate(-1 4) rotate(60 17 10)">
    <!-- engine plume -->
    <rect x="17" y="19" width="2" height="2" fill="#ff5f3c"/>
    <rect x="16" y="18" width="4" height="1" fill="#ff9a3c"/>
    <rect x="17" y="17" width="2" height="1" fill="#ffe8a8"/>
    <!-- engine section and folded landing legs -->
    <rect x="16" y="16" width="4" height="1" fill="#2b2d36"/>
    <rect x="15" y="13" width="1" height="4" fill="#1b1c22"/>
    <rect x="20" y="13" width="1" height="4" fill="#1b1c22"/>
    <!-- first stage: tall white body -->
    <rect x="16" y="6" width="4" height="10" fill="#f2f3f8"/>
    <rect x="19" y="6" width="1" height="10" fill="#c3c7da"/>
    <!-- black interstage, grid fins sticking out -->
    <rect x="16" y="5" width="4" height="1" fill="#1b1c22"/>
    <rect x="15" y="6" width="1" height="1" fill="#55596a"/>
    <rect x="20" y="6" width="1" height="1" fill="#55596a"/>
    <!-- second stage and rounded payload fairing -->
    <rect x="16" y="2" width="4" height="3" fill="#f2f3f8"/>
    <rect x="19" y="2" width="1" height="3" fill="#c3c7da"/>
    <rect x="17" y="0" width="2" height="1" fill="#f2f3f8"/>
    <rect x="16" y="1" width="4" height="1" fill="#e2e4ee"/>
    <!-- atomic breath: a glow, then the beam, from the open jaws ahead -->
    <g filter="url(#glow)">
      <rect x="12" y="-8" width="5" height="9" fill="#3fb6ff" opacity=".9"/>
      <rect x="6" y="2" width="5" height="11" fill="#3fb6ff" opacity=".6"/>
    </g>
    <rect x="12" y="-8" width="1" height="9" fill="#5fd3ff"/>
    <rect x="16" y="-8" width="1" height="9" fill="#5fd3ff"/>
    <rect x="13" y="-8" width="3" height="9" fill="#effcff"/>
    <rect x="13" y="-10" width="3" height="2" fill="#5fd3ff" opacity=".7"/>
    <!-- the kaiju riding the booster, jaws open, head thrown forward -->
    <rect x="10" y="7" width="6" height="7" fill="#26282f"/>
    <rect x="11" y="8" width="3" height="5" fill="#44485a"/>
    <rect x="10" y="3" width="6" height="4" fill="#26282f"/>
    <rect x="11" y="2" width="1" height="1" fill="#26282f"/>
    <rect x="15" y="1" width="2" height="2" fill="#26282f"/>
    <rect x="12" y="1" width="1" height="2" fill="#26282f"/>
    <rect x="13" y="1" width="2" height="2" fill="#bff6ff"/>
    <rect x="11" y="4" width="1" height="1" fill="#7ef0ff"/>
    <rect x="13" y="3" width="1" height="1" fill="#e9e4d6"/>
    <rect x="15" y="3" width="1" height="1" fill="#e9e4d6"/>
    <!-- arms gripping the hull -->
    <rect x="15" y="8" width="2" height="1" fill="#26282f"/>
    <rect x="15" y="11" width="2" height="1" fill="#26282f"/>
    <rect x="16" y="9" width="1" height="1" fill="#0e0f14"/>
    <!-- dorsal plates blazing down its back -->
    <rect x="8" y="3" width="2" height="2" fill="#5fd3ff"/>
    <rect x="7" y="4" width="1" height="1" fill="#c9f4ff"/>
    <rect x="7" y="6" width="3" height="2" fill="#5fd3ff"/>
    <rect x="6" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="9" width="2" height="2" fill="#5fd3ff"/>
    <rect x="7" y="10" width="1" height="1" fill="#c9f4ff"/>
    <rect x="8" y="12" width="2" height="1" fill="#5fd3ff"/>
    <!-- legs braced on the fins -->
    <rect x="12" y="14" width="3" height="1" fill="#0e0f14"/>
    <!-- a thick tail streaming back behind it, lit along its ridge -->
    <rect x="9" y="13" width="3" height="3" fill="#4a4f5e"/>
    <rect x="8" y="16" width="3" height="2" fill="#4a4f5e"/>
    <rect x="7" y="18" width="2" height="2" fill="#4a4f5e"/>
    <rect x="6" y="20" width="2" height="1" fill="#4a4f5e"/>
    <rect x="5" y="21" width="1" height="1" fill="#4a4f5e"/>
    <rect x="8" y="14" width="1" height="1" fill="#5fd3ff"/>
    <rect x="7" y="17" width="1" height="1" fill="#5fd3ff"/>
    <rect x="6" y="19" width="1" height="1" fill="#c9f4ff"/>
    <rect x="11" y="15" width="1" height="1" fill="#26282f"/>
    <!-- speed lines streaming down -->
    <rect x="23" y="4" width="1" height="4" fill="#9fe6ff" opacity=".6"/>
    <rect x="25" y="9" width="1" height="5" fill="#9fe6ff" opacity=".5"/>
    <rect x="3" y="2" width="1" height="4" fill="#9fe6ff" opacity=".5"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2">
    <text x="75.5" y="15" fill="#05010f" fill-opacity=".45">DEVORBIT</text>
    <text x="75" y="14">DEVORBIT</text>
  </g>
</svg>
