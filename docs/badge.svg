<svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" viewBox="0 0 104 20" role="img" aria-label="DEVORBIT">
  <title>DEVORBIT</title>
  <defs>
    <!-- deep space, purple to blue, with two nebula glows -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a33"/>
      <stop offset=".55" stop-color="#2a1660"/>
      <stop offset="1" stop-color="#0d1b4a"/>
    </linearGradient>
    <radialGradient id="nebula-pink" cx="30%" cy="80%" r="45%">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-blue" cx="80%" cy="15%" r="45%">
      <stop offset="0" stop-color="#3fb6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-opacity=".18"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="104" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="104" height="20" fill="url(#space)"/>
    <rect width="104" height="20" fill="url(#nebula-pink)"/>
    <rect width="104" height="20" fill="url(#nebula-blue)"/>
    <!-- stars -->
    <g fill="#fff" shape-rendering="crispEdges">
      <rect x="27" y="3" width="1" height="1" opacity=".9"/>
      <rect x="41" y="16" width="1" height="1" opacity=".6"/>
      <rect x="58" y="2" width="1" height="1" opacity=".7"/>
      <rect x="73" y="17" width="1" height="1" opacity=".8"/>
      <rect x="88" y="4" width="1" height="1" opacity=".9"/>
      <rect x="99" y="15" width="1" height="1" opacity=".6"/>
      <rect x="2" y="2" width="1" height="1" opacity=".8"/>
      <rect x="20" y="17" width="1" height="1" opacity=".7"/>
      <rect x="95" y="9" width="1" height="1" opacity=".5"/>
    </g>
    <rect x="22" y="4" width="1" height="12" fill="#fff" opacity=".18"/>
    <rect width="104" height="20" fill="url(#shine)"/>
  </g>
  <!-- a pixel rocket on its orbit: the dotted path curves round behind it -->
  <g shape-rendering="crispEdges">
    <g fill="#9fe6ff" opacity=".85">
      <rect x="3" y="14" width="1" height="1"/>
      <rect x="5" y="16" width="1" height="1"/>
      <rect x="8" y="17" width="1" height="1"/>
      <rect x="12" y="17" width="1" height="1"/>
      <rect x="16" y="16" width="1" height="1"/>
      <rect x="2" y="11" width="1" height="1"/>
    </g>
    <!-- body, pointing up-right -->
    <rect x="12" y="4" width="3" height="1" fill="#ffffff"/>
    <rect x="11" y="5" width="5" height="1" fill="#ffffff"/>
    <rect x="10" y="6" width="5" height="1" fill="#e8e8f5"/>
    <rect x="9" y="7" width="5" height="1" fill="#e8e8f5"/>
    <rect x="8" y="8" width="5" height="1" fill="#d6d6ea"/>
    <rect x="11" y="6" width="2" height="2" fill="#3fb6ff"/>
    <!-- fins -->
    <rect x="7" y="8" width="1" height="2" fill="#ff4f6d"/>
    <rect x="10" y="10" width="2" height="1" fill="#ff4f6d"/>
    <rect x="8" y="9" width="3" height="1" fill="#ff4f6d"/>
    <!-- flame -->
    <rect x="7" y="10" width="2" height="1" fill="#ffd36b"/>
    <rect x="6" y="11" width="2" height="1" fill="#ff9a3c"/>
    <rect x="5" y="12" width="1" height="1" fill="#ff5f3c"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2">
    <text x="63.5" y="15" fill="#05010f" fill-opacity=".45">DEVORBIT</text>
    <text x="63" y="14">DEVORBIT</text>
  </g>
</svg>
