<svg xmlns="http://www.w3.org/2000/svg" width="116" height="20" viewBox="0 0 116 20" role="img" aria-label="DEVORBIT">
  <title>DEVORBIT</title>
  <defs>
    <!-- deep space, purple to blue, with two nebula glows -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a33"/>
      <stop offset=".55" stop-color="#2a1660"/>
      <stop offset="1" stop-color="#0d1b4a"/>
    </linearGradient>
    <radialGradient id="nebula-pink" cx="25%" cy="85%" r="45%">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-blue" cx="80%" cy="15%" r="45%">
      <stop offset="0" stop-color="#3fb6ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="1" stop-opacity=".18"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="116" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="116" height="20" fill="url(#space)"/>
    <rect width="116" height="20" fill="url(#nebula-pink)"/>
    <rect width="116" height="20" fill="url(#nebula-blue)"/>
    <!-- stars -->
    <g fill="#fff" shape-rendering="crispEdges">
      <rect x="39" y="3" width="1" height="1" opacity=".9"/>
      <rect x="53" y="16" width="1" height="1" opacity=".6"/>
      <rect x="70" y="2" width="1" height="1" opacity=".7"/>
      <rect x="85" y="17" width="1" height="1" opacity=".8"/>
      <rect x="100" y="4" width="1" height="1" opacity=".9"/>
      <rect x="111" y="15" width="1" height="1" opacity=".6"/>
      <rect x="27" y="2" width="1" height="1" opacity=".8"/>
      <rect x="2" y="3" width="1" height="1" opacity=".7"/>
      <rect x="107" y="9" width="1" height="1" opacity=".5"/>
    </g>
    <rect x="33" y="4" width="1" height="12" fill="#fff" opacity=".18"/>
    <rect width="116" height="20" fill="url(#shine)"/>
  </g>
  <!-- a pixel kaiju riding a rocket straight up -->
  <g shape-rendering="crispEdges">
    <!-- exhaust trail and flame below -->
    <rect x="17" y="19" width="2" height="1" fill="#ff5f3c"/>
    <rect x="16" y="17" width="4" height="2" fill="#ff9a3c"/>
    <rect x="17" y="16" width="2" height="2" fill="#ffd36b"/>
    <!-- rocket: nose, body, window, fins -->
    <rect x="17" y="0" width="2" height="1" fill="#ff4f6d"/>
    <rect x="16" y="1" width="4" height="2" fill="#ff4f6d"/>
    <rect x="16" y="3" width="4" height="13" fill="#e8e8f5"/>
    <rect x="19" y="3" width="1" height="13" fill="#b9bdd6"/>
    <rect x="17" y="5" width="2" height="2" fill="#3fb6ff"/>
    <rect x="14" y="12" width="2" height="4" fill="#ff4f6d"/>
    <rect x="20" y="12" width="2" height="4" fill="#ff4f6d"/>
    <!-- the kaiju clinging on, back to us, head turned up -->
    <rect x="10" y="7" width="6" height="7" fill="#3a3d45"/>
    <rect x="11" y="9" width="3" height="4" fill="#5a5e68"/>
    <rect x="11" y="3" width="5" height="4" fill="#3a3d45"/>
    <rect x="12" y="2" width="3" height="1" fill="#3a3d45"/>
    <rect x="14" y="4" width="1" height="1" fill="#ffcf40"/>
    <rect x="15" y="2" width="1" height="2" fill="#ff5e3a"/>
    <rect x="15" y="9" width="1" height="1" fill="#0e0f14"/>
    <!-- arms hugging the rocket -->
    <rect x="15" y="8" width="2" height="1" fill="#3a3d45"/>
    <rect x="15" y="11" width="2" height="1" fill="#3a3d45"/>
    <!-- glowing dorsal plates down its back -->
    <rect x="9" y="4" width="2" height="1" fill="#5fd3ff"/>
    <rect x="8" y="6" width="2" height="1" fill="#c9f4ff"/>
    <rect x="9" y="7" width="1" height="1" fill="#5fd3ff"/>
    <rect x="8" y="9" width="2" height="1" fill="#c9f4ff"/>
    <rect x="9" y="10" width="1" height="1" fill="#5fd3ff"/>
    <rect x="8" y="12" width="2" height="1" fill="#5fd3ff"/>
    <!-- feet on the fin, tail swinging down -->
    <rect x="12" y="14" width="2" height="1" fill="#0e0f14"/>
    <rect x="9" y="14" width="2" height="2" fill="#3a3d45"/>
    <rect x="7" y="16" width="3" height="1" fill="#3a3d45"/>
    <rect x="5" y="17" width="2" height="1" fill="#3a3d45"/>
    <!-- speed lines streaming down -->
    <rect x="23" y="4" width="1" height="4" fill="#9fe6ff" opacity=".6"/>
    <rect x="25" y="9" width="1" height="5" fill="#9fe6ff" opacity=".5"/>
    <rect x="3" y="2" width="1" height="4" fill="#9fe6ff" opacity=".5"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2">
    <text x="75.5" y="15" fill="#05010f" fill-opacity=".45">DEVORBIT</text>
    <text x="75" y="14">DEVORBIT</text>
  </g>
</svg>
