<svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" viewBox="0 0 104 20" role="img" aria-label="DEVORBIT">
  <title>DEVORBIT</title>
  <defs>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-opacity=".12"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="104" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="24" height="20" fill="#d97757"/>
    <rect x="1" y="1" width="22" height="18" rx="2" fill="#3a2f6e"/>
    <rect x="24" width="80" height="20" fill="#1e1f29"/>
    <rect width="104" height="20" fill="url(#shine)"/>
  </g>
  <!-- a pixel planet with its ring: the orbit -->
  <g shape-rendering="crispEdges">
    <rect x="9" y="6" width="6" height="8" fill="#ffd36b"/>
    <rect x="8" y="7" width="8" height="6" fill="#ffd36b"/>
    <rect x="8" y="10" width="8" height="3" fill="#f0a93a"/>
    <rect x="9" y="13" width="6" height="1" fill="#f0a93a"/>
    <rect x="3" y="10" width="18" height="1" fill="#fff6e8"/>
    <rect x="4" y="9" width="2" height="1" fill="#fff6e8"/>
    <rect x="18" y="11" width="2" height="1" fill="#fff6e8"/>
    <rect x="18" y="4" width="1" height="1" fill="#fff6e8"/>
    <rect x="5" y="15" width="1" height="1" fill="#fff6e8"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,Geneva,sans-serif" font-size="10" font-weight="bold" letter-spacing="1.2">
    <text x="64.5" y="15" fill="#010101" fill-opacity=".3">DEVORBIT</text>
    <text x="64" y="14">DEVORBIT</text>
  </g>
</svg>
